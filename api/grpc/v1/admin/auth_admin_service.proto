syntax = "proto3";

package github.com.martketplace.vkr.auth.pkg.api.grpc.v1.admin;

option go_package = "github.com/martketplace-vkr/auth/pkg/api/grpc/v1/admin;admin";

service AuthAdminService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateInviteToken(CreateInviteTokenRequest) returns (CreateInviteTokenResponse);
  rpc ListVendors(ListVendorsRequest) returns (ListVendorsResponse);
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc GetClient(GetClientRequest) returns (Client);
  rpc UpdateClientStatus(UpdateClientStatusRequest) returns (Client);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string invite_token = 3;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  int64 user_id = 1;
  string role = 2;
  string login = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message CreateInviteTokenRequest {
  int64 user_id = 1;
  int64 role_id = 2;
}

message CreateInviteTokenResponse {
  string token = 1;
}

message ListVendorsRequest {}

message Vendor {
  int64 vendor_id = 1;
  string email = 2;
}

message ListVendorsResponse {
  repeated Vendor vendors = 1;
}

message ListClientsRequest {
  string query = 1;
  string status = 2;
  uint32 limit = 3;
  uint32 offset = 4;
}

message GetClientRequest {
  int64 client_id = 1;
}

message UpdateClientStatusRequest {
  int64 client_id = 1;
  string status = 2;
  string reason = 3;
  int64 admin_id = 4;
}

message ClientModerationEvent {
  int64 id = 1;
  int64 admin_id = 2;
  string old_status = 3;
  string new_status = 4;
  string reason = 5;
  string created_at = 6;
}

message Client {
  int64 client_id = 1;
  string email = 2;
  bool email_verified = 3;
  string status = 4;
  string status_reason = 5;
  string created_at = 6;
  string updated_at = 7;
  string last_activity_at = 8;
  repeated ClientModerationEvent moderation_events = 9;
}

message ListClientsResponse {
  repeated Client clients = 1;
  uint64 total = 2;
}
